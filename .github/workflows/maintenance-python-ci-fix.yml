name: Apply Python CI Portability Fix

on:
  push:
    branches:
      - maintenance/python-ci-portability-20260813
    paths:
      - .github/workflows/maintenance-python-ci-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v5
        with:
          ref: maintenance/python-ci-portability-20260813

      - name: Apply focused compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # setup.py: keep the documented Python 3.10+ contract and avoid
          # Python 3.12-only f-string parsing syntax.
          path = Path("setup.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '    if v < (3, 8):\n        err(f"需要 Python >= 3.8，当前 {v.major}.{v.minor}")',
              '    if v < (3, 10):\n        err(f"需要 Python >= 3.10，当前 {v.major}.{v.minor}")',
              1,
          )
          old = '        print(f"    {_c(\'36\', \'gary do \\\"让 PA0 LED 以 500ms 闪烁\\\"\')}  一次性执行任务")'
          new = '        example_cmd = \'gary do "让 PA0 LED 以 500ms 闪烁"\'\n        print(f"    {_c(\'36\', example_cmd)}  一次性执行任务")'
          if old not in text:
              raise SystemExit("setup.py compatibility target not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # Black must not format the codebase assuming syntax newer than the
          # minimum supported interpreter.
          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace('target-version = ["py312"]', 'target-version = ["py310"]', 1)
          path.write_text(text, encoding="utf-8")

          # Installer tests: remove host-OS path assumptions while preserving
          # the same production behavior assertions.
          path = Path("tests/test_setup_install.py")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'def test_resolve_win_install_dir_falls_back_when_helper_missing(monkeypatch):\n'
              '    """Missing _get_win_install_dir should not break Windows install."""\n\n'
              '    module = _load_setup_module(monkeypatch)\n'
              '    monkeypatch.delitem(module.__dict__, "_get_win_install_dir", raising=False)\n'
              '    monkeypatch.setattr(module.sys, "executable", str(Path("/tmp/gary-venv/Scripts/python.exe")))\n\n'
              '    assert module._resolve_win_install_dir() == Path("/tmp/gary-venv/Scripts")\n',
              'def test_resolve_win_install_dir_falls_back_when_helper_missing(monkeypatch, tmp_path):\n'
              '    """Missing _get_win_install_dir should not break Windows install."""\n\n'
              '    module = _load_setup_module(monkeypatch)\n'
              '    fake_python = tmp_path / "gary-venv" / "Scripts" / "python.exe"\n'
              '    monkeypatch.delitem(module.__dict__, "_get_win_install_dir", raising=False)\n'
              '    monkeypatch.setattr(module.sys, "executable", str(fake_python))\n\n'
              '    assert module._resolve_win_install_dir() == fake_python.parent.resolve()\n',
              1,
          )

          text = text.replace(
              'def test_default_win_install_dir_uses_existing_scripts_dir(monkeypatch):\n'
              '    """If python.exe already lives in Scripts, do not append another Scripts."""\n\n'
              '    module = _load_setup_module(monkeypatch)\n'
              '    monkeypatch.setattr(module.sys, "executable", str(Path("/tmp/gary-venv/Scripts/python.exe")))\n\n'
              '    assert module._default_win_install_dir() == Path("/tmp/gary-venv/Scripts")\n',
              'def test_default_win_install_dir_uses_existing_scripts_dir(monkeypatch, tmp_path):\n'
              '    """If python.exe already lives in Scripts, do not append another Scripts."""\n\n'
              '    module = _load_setup_module(monkeypatch)\n'
              '    fake_python = tmp_path / "gary-venv" / "Scripts" / "python.exe"\n'
              '    monkeypatch.setattr(module.sys, "executable", str(fake_python))\n\n'
              '    assert module._default_win_install_dir() == fake_python.parent.resolve()\n',
              1,
          )

          text = text.replace(
              '    venv_python = tmp_path / ".venv" / "bin" / "python"\n'
              '    venv_python.parent.mkdir(parents=True, exist_ok=True)\n'
              '    venv_python.write_text("#!/usr/bin/env python3\\n", encoding="utf-8")\n'
              '    monkeypatch.setattr(module, "VENV_DIR", tmp_path / ".venv")\n',
              '    venv_dir = tmp_path / ".venv"\n'
              '    monkeypatch.setattr(module, "VENV_DIR", venv_dir)\n'
              '    venv_python = module._venv_python_path(venv_dir)\n'
              '    venv_python.parent.mkdir(parents=True, exist_ok=True)\n'
              '    venv_python.write_text("#!/usr/bin/env python3\\n", encoding="utf-8")\n',
              1,
          )

          text = text.replace(
              '    venv_dir = tmp_path / ".venv"\n'
              '    venv_python = venv_dir / "bin" / "python"\n'
              '    marker = tmp_path / "EXTERNALLY-MANAGED"\n',
              '    venv_dir = tmp_path / ".venv"\n'
              '    monkeypatch.setattr(module, "VENV_DIR", venv_dir)\n'
              '    venv_python = module._venv_python_path(venv_dir)\n'
              '    marker = tmp_path / "EXTERNALLY-MANAGED"\n',
              1,
          )
          text = text.replace(
              '    monkeypatch.setattr(module, "VENV_DIR", venv_dir)\n'
              '    monkeypatch.setattr(module, "_inside_virtualenv", lambda: False)\n'
              '    monkeypatch.setattr(module, "_externally_managed_marker", lambda: marker)\n'
              '    monkeypatch.setattr(module, "_run", _fake_run)\n',
              '    monkeypatch.setattr(module, "_inside_virtualenv", lambda: False)\n'
              '    monkeypatch.setattr(module, "_externally_managed_marker", lambda: marker)\n'
              '    monkeypatch.setattr(module, "_run", _fake_run)\n',
              1,
          )

          text = text.replace(
              '    module = _load_setup_module(monkeypatch)\n'
              '    called = {"value": False, "auto": None, "explicit": None}\n\n'
              '    monkeypatch.setattr(module, "_searxng_healthcheck", lambda base_url=None: False)\n',
              '    module = _load_setup_module(monkeypatch)\n'
              '    called = {"value": False, "auto": None, "explicit": None}\n\n'
              '    monkeypatch.setattr(module, "IS_WIN", False)\n'
              '    monkeypatch.setattr(module, "IS_LINUX", True)\n'
              '    monkeypatch.setattr(module, "IS_MAC", False)\n'
              '    monkeypatch.setattr(module, "_searxng_healthcheck", lambda base_url=None: False)\n',
              1,
          )

          text = text.replace(
              '    monkeypatch.setattr(module, "IS_LINUX", True)\n'
              '    monkeypatch.setattr(module, "SEARXNG_DIR", tmp_path / "services" / "searxng")\n',
              '    monkeypatch.setattr(module, "IS_WIN", False)\n'
              '    monkeypatch.setattr(module, "IS_LINUX", True)\n'
              '    monkeypatch.setattr(module, "IS_MAC", False)\n'
              '    monkeypatch.setattr(module, "SEARXNG_DIR", tmp_path / "services" / "searxng")\n',
              1,
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fixes back to maintenance branch
        shell: bash
        run: |
          git config user.name "garycli-maintenance"
          git config user.email "noreply@github.com"
          git add setup.py pyproject.toml tests/test_setup_install.py
          if git diff --cached --quiet; then
            echo "No maintenance changes produced"
            exit 0
          fi
          git commit -m "fix: restore Python 3.10 and portable installer tests"
          git push origin HEAD:maintenance/python-ci-portability-20260813
