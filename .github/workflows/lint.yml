name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install "black>=24.0" flake8

      - name: Check formatting with black
        run: black . --line-length 100 --check --diff

      - name: Lint with flake8
        run: |
          flake8 . \
            --max-line-length=100 \
            --extend-ignore=E501,F541,F841,F821,F401,F403,F405,F811,F824,E741,E402,E401,E203,E231,W391 \
            --exclude=.venv,__pycache__,*.egg-info
